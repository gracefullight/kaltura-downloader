name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      ext-release-created: ${{ steps.release.outputs['apps/ext--release_created'] }}
      ext-tag-name: ${{ steps.release.outputs['apps/ext--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    name: Build & Upload Extension
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.ext-release-created == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Package extension
        run: cd apps/ext/dist && zip -r ../../../kaltura-downloader-${{ needs.release-please.outputs.ext-tag-name }}.zip .

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.ext-tag-name }}" "kaltura-downloader-${{ needs.release-please.outputs.ext-tag-name }}.zip"

      - name: Publish to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --auto-publish --source "kaltura-downloader-${{ needs.release-please.outputs.ext-tag-name }}.zip"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Package Firefox AMO upload
        run: bun --filter @kaltura-downloader/ext build:firefox

      - name: Upload Firefox AMO package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.ext-tag-name }}" apps/ext/artifacts/firefox/*.zip

  submit-to-firefox-addons:
    name: Submit to Firefox Add-ons
    runs-on: ubuntu-latest
    needs: [release-please, build-and-release]
    if: needs.release-please.outputs.ext-release-created == 'true'
    steps:
      - name: Check Firefox Add-ons credentials
        id: credentials
        env:
          API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        run: |
          if [ -n "$API_KEY" ] && [ -n "$API_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip submission until credentials are configured
        if: steps.credentials.outputs.available != 'true'
        run: >-
          echo "Firefox Add-ons submission skipped: configure FIREFOX_AMO_API_KEY and FIREFOX_AMO_API_SECRET."

      - if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4
      - if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.credentials.outputs.available == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.credentials.outputs.available == 'true'
        run: bun install --frozen-lockfile
      - if: steps.credentials.outputs.available == 'true'
        run: bun run build

      - name: Create reviewable source archive
        if: steps.credentials.outputs.available == 'true'
        run: git archive --format=zip --output="kaltura-downloader-${{ needs.release-please.outputs.ext-tag-name }}-source.zip" "${GITHUB_SHA}"

      - name: Submit signed release to Firefox Add-ons
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes web-ext@10.6.0 sign --source-dir=apps/ext/dist --artifacts-dir=apps/ext/artifacts/firefox-signed --channel=listed --amo-metadata=apps/ext/amo-metadata.json --upload-source-code="kaltura-downloader-${{ needs.release-please.outputs.ext-tag-name }}-source.zip" --approval-timeout=0
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
